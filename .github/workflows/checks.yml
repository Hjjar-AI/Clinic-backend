name: Backend checks
'on':
  push: null
  pull_request: null
  schedule:
  - cron: 37 4 * * 1
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: Frontend revision supplying fonts (commit SHA recommended)
        default: main
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'automatic' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
jobs:
  sqlite:
    name: SQLite and runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - windows-2022
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        path: backend
        persist-credentials: false
      id: checkout
    - name: Record checked-out revisions
      shell: python
      env:
        CI_REPOSITORIES: '{"backend": "backend"}'
      run: |
        import json, os, re, subprocess
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
            summary.write('### Checked-out source revisions\n\n')
            for name, directory in json.loads(os.environ['CI_REPOSITORIES']).items():
                result = subprocess.run(['git', '-C', directory, 'rev-parse', '--verify', 'HEAD'], capture_output=True, text=True, check=True, timeout=10)
                sha = result.stdout.strip()
                if not re.fullmatch(r'[0-9a-fA-F]{40}', sha):
                    raise SystemExit('Invalid checked-out revision')
                summary.write(f'- {name}: `{sha}`\n')
      id: record_checked_out_revisions
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: Hjjar-AI/Clinic-frontend
        ref: ${{ inputs.frontend_ref || 'main' }}
        path: frontend
        persist-credentials: false
      id: checkout_2
    - name: Record checked-out revisions
      shell: python
      env:
        CI_REPOSITORIES: '{"frontend": "frontend"}'
      run: |
        import json, os, re, subprocess
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
            summary.write('### Checked-out source revisions\n\n')
            for name, directory in json.loads(os.environ['CI_REPOSITORIES']).items():
                result = subprocess.run(['git', '-C', directory, 'rev-parse', '--verify', 'HEAD'], capture_output=True, text=True, check=True, timeout=10)
                sha = result.stdout.strip()
                if not re.fullmatch(r'[0-9a-fA-F]{40}', sha):
                    raise SystemExit('Invalid checked-out revision')
                summary.write(f'- {name}: `{sha}`\n')
      id: record_checked_out_revisions_2
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: |
          backend/requirements.txt
          backend/requirements/*.txt
      id: setup_python
    - uses: ./backend/.github/actions/native-dependencies
      id: native_dependencies
    - run: python -m pip install -r backend/requirements/sqlite.txt
      id: install_dependencies
    - name: Native locks, MIME, fonts and synthetic PDF
      working-directory: backend
      run: python -B manage.py check_runtime --render-pdf --settings=config.settings.testing
      id: native_locks_mime_fonts_and_synthetic_pdf
    - name: Start, HTTP access checks and shutdown (disposable runtime)
      run: python -B backend/scripts/runtime_smoke.py
      id: start_http_access_checks_and_shutdown_disposable_runtime
    - name: Isolated SQLite suite
      working-directory: backend
      run: python -B tests/run.py
      id: isolated_sqlite_suite
    - name: Summarize results
      if: always()
      shell: python
      env:
        CI_REPOSITORIES: '{"backend": "backend", "frontend": "frontend"}'
        CI_JOB_STATUS: ${{ job.status }}
        CI_STEPS_JSON: ${{ toJSON(steps) }}
      run: |
        import json, os, re, subprocess
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
            summary.write('### Job results\n\n')
            summary.write(f'Runner: {os.environ["RUNNER_OS"]}; status: {os.environ["CI_JOB_STATUS"]}\n\n')
            for name, directory in json.loads(os.environ['CI_REPOSITORIES']).items():
                try:
                    result = subprocess.run(['git', '-C', directory, 'rev-parse', '--verify', 'HEAD'], capture_output=True, text=True, check=True, timeout=10)
                    sha = result.stdout.strip()
                    if not re.fullmatch(r'[0-9a-fA-F]{40}', sha):
                        sha = 'unavailable'
                except (OSError, subprocess.SubprocessError):
                    sha = 'unavailable'
                summary.write(f'- {name}: `{sha}`\n')
            for name in ('BACKEND', 'FRONTEND'):
                sha = os.environ.get('CI_EXPECTED_' + name + '_SHA', '')
                if sha:
                    sha = sha if re.fullmatch(r'[0-9a-fA-F]{40}', sha) else 'unavailable'
                    summary.write(f'- requested {name.lower()}: `{sha}`\n')
            summary.write('\n| Step | Outcome |\n| --- | --- |\n')
            artifacts = []
            for name, step in json.loads(os.environ['CI_STEPS_JSON']).items():
                outcome = step.get('outcome', step.get('result', 'unknown'))
                summary.write(f'| {name} | {outcome} |\n')
                outputs = step.get('outputs', {})
                artifact_id = str(outputs.get('artifact-id', ''))
                url = outputs.get('artifact-url', '')
                if re.fullmatch(r'[0-9]+', artifact_id):
                    label = f'{name}: artifact {artifact_id}'
                    artifacts.append(f'- [{label}]({url})' if re.fullmatch(r'https://github\.com/[\w./-]+', url) else f'- {label}')
            summary.write('\nUploaded artifacts:\n\n' + '\n'.join(artifacts or ['- None recorded for this job.']) + '\n')
  postgres:
    name: PostgreSQL concurrency and failure recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        path: backend
        persist-credentials: false
      id: checkout
    - name: Record checked-out revisions
      shell: python
      env:
        CI_REPOSITORIES: '{"backend": "backend"}'
      run: |
        import json, os, re, subprocess
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
            summary.write('### Checked-out source revisions\n\n')
            for name, directory in json.loads(os.environ['CI_REPOSITORIES']).items():
                result = subprocess.run(['git', '-C', directory, 'rev-parse', '--verify', 'HEAD'], capture_output=True, text=True, check=True, timeout=10)
                sha = result.stdout.strip()
                if not re.fullmatch(r'[0-9a-fA-F]{40}', sha):
                    raise SystemExit('Invalid checked-out revision')
                summary.write(f'- {name}: `{sha}`\n')
      id: record_checked_out_revisions
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: Hjjar-AI/Clinic-frontend
        ref: ${{ inputs.frontend_ref || 'main' }}
        path: frontend
        persist-credentials: false
      id: checkout_2
    - name: Record checked-out revisions
      shell: python
      env:
        CI_REPOSITORIES: '{"frontend": "frontend"}'
      run: |
        import json, os, re, subprocess
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
            summary.write('### Checked-out source revisions\n\n')
            for name, directory in json.loads(os.environ['CI_REPOSITORIES']).items():
                result = subprocess.run(['git', '-C', directory, 'rev-parse', '--verify', 'HEAD'], capture_output=True, text=True, check=True, timeout=10)
                sha = result.stdout.strip()
                if not re.fullmatch(r'[0-9a-fA-F]{40}', sha):
                    raise SystemExit('Invalid checked-out revision')
                summary.write(f'- {name}: `{sha}`\n')
      id: record_checked_out_revisions_2
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: |
          backend/requirements.txt
          backend/requirements/*.txt
      id: setup_python
    - uses: ./backend/.github/actions/native-dependencies
      id: native_dependencies
    - name: Install disposable-cluster tooling
      run: sudo apt-get install -y postgresql
      id: install_disposable_cluster_tooling
    - run: python -m pip install -r backend/requirements/postgresql.txt
      id: install_dependencies
    - name: Owned PostgreSQL suite (Unix socket, no clinic storage)
      working-directory: backend
      run: python -B tests/run_postgres.py
      id: owned_postgresql_suite_unix_socket_no_clinic_storage
    - name: Summarize results
      if: always()
      shell: python
      env:
        CI_REPOSITORIES: '{"backend": "backend", "frontend": "frontend"}'
        CI_JOB_STATUS: ${{ job.status }}
        CI_STEPS_JSON: ${{ toJSON(steps) }}
      run: |
        import json, os, re, subprocess
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
            summary.write('### Job results\n\n')
            summary.write(f'Runner: {os.environ["RUNNER_OS"]}; status: {os.environ["CI_JOB_STATUS"]}\n\n')
            for name, directory in json.loads(os.environ['CI_REPOSITORIES']).items():
                try:
                    result = subprocess.run(['git', '-C', directory, 'rev-parse', '--verify', 'HEAD'], capture_output=True, text=True, check=True, timeout=10)
                    sha = result.stdout.strip()
                    if not re.fullmatch(r'[0-9a-fA-F]{40}', sha):
                        sha = 'unavailable'
                except (OSError, subprocess.SubprocessError):
                    sha = 'unavailable'
                summary.write(f'- {name}: `{sha}`\n')
            for name in ('BACKEND', 'FRONTEND'):
                sha = os.environ.get('CI_EXPECTED_' + name + '_SHA', '')
                if sha:
                    sha = sha if re.fullmatch(r'[0-9a-fA-F]{40}', sha) else 'unavailable'
                    summary.write(f'- requested {name.lower()}: `{sha}`\n')
            summary.write('\n| Step | Outcome |\n| --- | --- |\n')
            artifacts = []
            for name, step in json.loads(os.environ['CI_STEPS_JSON']).items():
                outcome = step.get('outcome', step.get('result', 'unknown'))
                summary.write(f'| {name} | {outcome} |\n')
                outputs = step.get('outputs', {})
                artifact_id = str(outputs.get('artifact-id', ''))
                url = outputs.get('artifact-url', '')
                if re.fullmatch(r'[0-9]+', artifact_id):
                    label = f'{name}: artifact {artifact_id}'
                    artifacts.append(f'- [{label}]({url})' if re.fullmatch(r'https://github\.com/[\w./-]+', url) else f'- {label}')
            summary.write('\nUploaded artifacts:\n\n' + '\n'.join(artifacts or ['- None recorded for this job.']) + '\n')
