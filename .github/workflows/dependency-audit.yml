name: Dependency vulnerability report

on:
  push:
    paths: [requirements.txt, 'requirements/**', .github/workflows/dependency-audit.yml]
  pull_request:
    paths: [requirements.txt, 'requirements/**', .github/workflows/dependency-audit.yml]
  schedule:
    - cron: '7 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        profile: [sqlite, postgresql, mysql, cache-redis, cache-memcached]
        include:
          - os: windows-2022
            profile: postgresql
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install pip-audit
      - name: MySQL/MariaDB resolution headers
        if: matrix.profile == 'mysql'
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - name: Resolve and audit the selected profile without applying fixes
        shell: bash
        env:
          AUDIT_PROFILE: ${{ matrix.profile }}
        run: |
          audit_requirements=(-r "requirements/$AUDIT_PROFILE.txt")
          if [[ "$AUDIT_PROFILE" == cache-* ]]; then audit_requirements+=(-r requirements.txt); fi
          python -m pip_audit "${audit_requirements[@]}" --format json --output dependency-audit.json --progress-spinner off
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-dependency-audit-${{ runner.os }}-${{ matrix.profile }}-${{ github.run_id }}
          path: dependency-audit.json
          retention-days: 14
          if-no-files-found: warn
