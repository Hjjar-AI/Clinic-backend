name: Prepare draft release
'on':
  workflow_dispatch:
    inputs:
      bundle_run_id:
        description: Successful Windows and Linux bundles workflow run ID
        required: true
        type: string
      tag:
        description: Existing tag pointing to that bundle's backend commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: draft-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend_sha: ${{ steps.run.outputs.backend_sha }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
      id: checkout
    - name: Record checked-out revisions
      shell: python
      env:
        CI_REPOSITORIES: '{"backend": "."}'
      run: |
        import json, os, re, subprocess
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
            summary.write('### Checked-out source revisions\n\n')
            for name, directory in json.loads(os.environ['CI_REPOSITORIES']).items():
                result = subprocess.run(['git', '-C', directory, 'rev-parse', '--verify', 'HEAD'], capture_output=True, text=True, check=True, timeout=10)
                sha = result.stdout.strip()
                if not re.fullmatch(r'[0-9a-fA-F]{40}', sha):
                    raise SystemExit('Invalid checked-out revision')
                summary.write(f'- {name}: `{sha}`\n')
      id: record_checked_out_revisions
    - name: Require a successful bundle run from this repository
      id: run
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        BUNDLE_RUN_ID: ${{ inputs.bundle_run_id }}
      shell: python
      run: |
        import json, os, re, subprocess
        run_id = os.environ['BUNDLE_RUN_ID']
        if not re.fullmatch(r'[1-9][0-9]*', run_id):
            raise SystemExit('Expected a positive bundle run ID')
        run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GH_REPO"]}/actions/runs/{run_id}']))
        if run['path'] != '.github/workflows/bundles.yml' or run['event'] != 'workflow_dispatch' or run['conclusion'] != 'success':
            raise SystemExit('Select a successful manually dispatched bundle workflow run')
        if not re.fullmatch(r'[0-9a-f]{40}', run['head_sha']):
            raise SystemExit('Bundle run has no exact source revision')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('backend_sha=' + run['head_sha'] + '\n')
    - name: Summarize results
      if: always()
      shell: python
      env:
        CI_REPOSITORIES: '{"backend": "."}'
        CI_JOB_STATUS: ${{ job.status }}
        CI_STEPS_JSON: ${{ toJSON(steps) }}
      run: |
        import json, os, re, subprocess
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
            summary.write('### Job results\n\n')
            summary.write(f'Runner: {os.environ["RUNNER_OS"]}; status: {os.environ["CI_JOB_STATUS"]}\n\n')
            for name, directory in json.loads(os.environ['CI_REPOSITORIES']).items():
                try:
                    result = subprocess.run(['git', '-C', directory, 'rev-parse', '--verify', 'HEAD'], capture_output=True, text=True, check=True, timeout=10)
                    sha = result.stdout.strip()
                    if not re.fullmatch(r'[0-9a-fA-F]{40}', sha):
                        sha = 'unavailable'
                except (OSError, subprocess.SubprocessError):
                    sha = 'unavailable'
                summary.write(f'- {name}: `{sha}`\n')
            for name in ('BACKEND', 'FRONTEND'):
                sha = os.environ.get('CI_EXPECTED_' + name + '_SHA', '')
                if sha:
                    sha = sha if re.fullmatch(r'[0-9a-fA-F]{40}', sha) else 'unavailable'
                    summary.write(f'- requested {name.lower()}: `{sha}`\n')
            summary.write('\n| Step | Outcome |\n| --- | --- |\n')
            artifacts = []
            for name, step in json.loads(os.environ['CI_STEPS_JSON']).items():
                outcome = step.get('outcome', step.get('result', 'unknown'))
                summary.write(f'| {name} | {outcome} |\n')
                outputs = step.get('outputs', {})
                artifact_id = str(outputs.get('artifact-id', ''))
                url = outputs.get('artifact-url', '')
                if re.fullmatch(r'[0-9]+', artifact_id):
                    label = f'{name}: artifact {artifact_id}'
                    artifacts.append(f'- [{label}]({url})' if re.fullmatch(r'https://github\.com/[\w./-]+', url) else f'- {label}')
            summary.write('\nUploaded artifacts:\n\n' + '\n'.join(artifacts or ['- None recorded for this job.']) + '\n')
  verify:
    needs: source
    uses: ./.github/workflows/verify-bundles.yml
    with:
      run_id: ${{ inputs.bundle_run_id }}
      backend_sha: ${{ needs.source.outputs.backend_sha }}
  draft:
    needs:
    - source
    - verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 0
        persist-credentials: false
      id: checkout
    - name: Record checked-out revisions
      shell: python
      env:
        CI_REPOSITORIES: '{"backend": "."}'
      run: |
        import json, os, re, subprocess
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
            summary.write('### Checked-out source revisions\n\n')
            for name, directory in json.loads(os.environ['CI_REPOSITORIES']).items():
                result = subprocess.run(['git', '-C', directory, 'rev-parse', '--verify', 'HEAD'], capture_output=True, text=True, check=True, timeout=10)
                sha = result.stdout.strip()
                if not re.fullmatch(r'[0-9a-fA-F]{40}', sha):
                    raise SystemExit('Invalid checked-out revision')
                summary.write(f'- {name}: `{sha}`\n')
      id: record_checked_out_revisions
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        pattern: verified-*-${{ github.run_id }}
        merge-multiple: true
        path: verified
      id: download_artifact
    - name: Prepare notes and check existing tag/source consistency
      env:
        BACKEND_SHA: ${{ needs.source.outputs.backend_sha }}
        RELEASE_TAG: ${{ inputs.tag }}
        BUNDLE_RUN_ID: ${{ inputs.bundle_run_id }}
      run: python -B scripts/prepare_draft_release.py --directory verified --backend-sha "$BACKEND_SHA" --tag "$RELEASE_TAG" --run-id "$BUNDLE_RUN_ID" --repository "$GITHUB_REPOSITORY" --notes release-notes.md
      id: prepare_notes_and_check_existing_tag_source_consistency
    - name: Create a draft with the verified archives and evidence
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.tag }}
      run: gh release create "$RELEASE_TAG" verified/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Clinic $RELEASE_TAG" --notes-file release-notes.md
      id: create_a_draft_with_the_verified_archives_and_evidence
    - name: Summarize results
      if: always()
      shell: python
      env:
        CI_REPOSITORIES: '{"backend": "."}'
        CI_JOB_STATUS: ${{ job.status }}
        CI_STEPS_JSON: ${{ toJSON(steps) }}
        CI_EXPECTED_BACKEND_SHA: ${{ needs.source.outputs.backend_sha }}
      run: |
        import json, os, re, subprocess
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
            summary.write('### Job results\n\n')
            summary.write(f'Runner: {os.environ["RUNNER_OS"]}; status: {os.environ["CI_JOB_STATUS"]}\n\n')
            for name, directory in json.loads(os.environ['CI_REPOSITORIES']).items():
                try:
                    result = subprocess.run(['git', '-C', directory, 'rev-parse', '--verify', 'HEAD'], capture_output=True, text=True, check=True, timeout=10)
                    sha = result.stdout.strip()
                    if not re.fullmatch(r'[0-9a-fA-F]{40}', sha):
                        sha = 'unavailable'
                except (OSError, subprocess.SubprocessError):
                    sha = 'unavailable'
                summary.write(f'- {name}: `{sha}`\n')
            for name in ('BACKEND', 'FRONTEND'):
                sha = os.environ.get('CI_EXPECTED_' + name + '_SHA', '')
                if sha:
                    sha = sha if re.fullmatch(r'[0-9a-fA-F]{40}', sha) else 'unavailable'
                    summary.write(f'- requested {name.lower()}: `{sha}`\n')
            summary.write('\n| Step | Outcome |\n| --- | --- |\n')
            artifacts = []
            for name, step in json.loads(os.environ['CI_STEPS_JSON']).items():
                outcome = step.get('outcome', step.get('result', 'unknown'))
                summary.write(f'| {name} | {outcome} |\n')
                outputs = step.get('outputs', {})
                artifact_id = str(outputs.get('artifact-id', ''))
                url = outputs.get('artifact-url', '')
                if re.fullmatch(r'[0-9]+', artifact_id):
                    label = f'{name}: artifact {artifact_id}'
                    artifacts.append(f'- [{label}]({url})' if re.fullmatch(r'https://github\.com/[\w./-]+', url) else f'- {label}')
            summary.write('\nUploaded artifacts:\n\n' + '\n'.join(artifacts or ['- None recorded for this job.']) + '\n')
