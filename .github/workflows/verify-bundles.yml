name: Verify downloaded archives
'on':
  workflow_call:
    inputs:
      run_id:
        required: true
        type: string
      backend_sha:
        required: true
        type: string
      frontend_sha:
        default: ''
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - windows-2022
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
      id: checkout
    - name: Record checked-out revisions
      shell: python
      env:
        CI_REPOSITORIES: '{"backend": "."}'
      run: |
        import json, os, re, subprocess
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
            summary.write('### Checked-out source revisions\n\n')
            for name, directory in json.loads(os.environ['CI_REPOSITORIES']).items():
                result = subprocess.run(['git', '-C', directory, 'rev-parse', '--verify', 'HEAD'], capture_output=True, text=True, check=True, timeout=10)
                sha = result.stdout.strip()
                if not re.fullmatch(r'[0-9a-fA-F]{40}', sha):
                    raise SystemExit('Invalid checked-out revision')
                summary.write(f'- {name}: `{sha}`\n')
      id: record_checked_out_revisions
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.14'
      id: setup_python
    - name: Linux native prerequisites
      if: runner.os == 'Linux'
      uses: ./.github/actions/native-dependencies
      id: linux_native_prerequisites
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: Clinic-${{ runner.os }}-x64-${{ inputs.run_id }}
        path: downloaded
        github-token: ${{ github.token }}
        run-id: ${{ inputs.run_id }}
      id: download_artifact
    - name: Verify checksum, extract and run the downloaded executable
      shell: bash
      env:
        BACKEND_SHA: ${{ inputs.backend_sha }}
        FRONTEND_SHA: ${{ inputs.frontend_sha }}
      run: |
        archive="downloaded/Clinic-$RUNNER_OS-x64.tar.gz"
        if [ "$RUNNER_OS" = "Windows" ]; then archive="downloaded/Clinic-Windows-x64.zip"; fi
        python -B scripts/verify_archive.py --archive "$archive" --backend-sha "$BACKEND_SHA" --frontend-sha "$FRONTEND_SHA" --report "downloaded/verification-$RUNNER_OS.json"
      id: verify_checksum_extract_and_run_the_downloaded_executable
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: verified-${{ runner.os }}-${{ github.run_id }}
        path: downloaded/
        if-no-files-found: error
        retention-days: 30
      id: upload_artifact
    - name: Summarize results
      if: always()
      shell: python
      env:
        CI_REPOSITORIES: '{"backend": "."}'
        CI_JOB_STATUS: ${{ job.status }}
        CI_STEPS_JSON: ${{ toJSON(steps) }}
        CI_EXPECTED_BACKEND_SHA: ${{ inputs.backend_sha }}
        CI_EXPECTED_FRONTEND_SHA: ${{ inputs.frontend_sha }}
      run: |
        import json, os, re, subprocess
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
            summary.write('### Job results\n\n')
            summary.write(f'Runner: {os.environ["RUNNER_OS"]}; status: {os.environ["CI_JOB_STATUS"]}\n\n')
            for name, directory in json.loads(os.environ['CI_REPOSITORIES']).items():
                try:
                    result = subprocess.run(['git', '-C', directory, 'rev-parse', '--verify', 'HEAD'], capture_output=True, text=True, check=True, timeout=10)
                    sha = result.stdout.strip()
                    if not re.fullmatch(r'[0-9a-fA-F]{40}', sha):
                        sha = 'unavailable'
                except (OSError, subprocess.SubprocessError):
                    sha = 'unavailable'
                summary.write(f'- {name}: `{sha}`\n')
            for name in ('BACKEND', 'FRONTEND'):
                sha = os.environ.get('CI_EXPECTED_' + name + '_SHA', '')
                if sha:
                    sha = sha if re.fullmatch(r'[0-9a-fA-F]{40}', sha) else 'unavailable'
                    summary.write(f'- requested {name.lower()}: `{sha}`\n')
            summary.write('\n| Step | Outcome |\n| --- | --- |\n')
            artifacts = []
            for name, step in json.loads(os.environ['CI_STEPS_JSON']).items():
                outcome = step.get('outcome', step.get('result', 'unknown'))
                summary.write(f'| {name} | {outcome} |\n')
                outputs = step.get('outputs', {})
                artifact_id = str(outputs.get('artifact-id', ''))
                url = outputs.get('artifact-url', '')
                if re.fullmatch(r'[0-9]+', artifact_id):
                    label = f'{name}: artifact {artifact_id}'
                    artifacts.append(f'- [{label}]({url})' if re.fullmatch(r'https://github\.com/[\w./-]+', url) else f'- {label}')
            summary.write('\nUploaded artifacts:\n\n' + '\n'.join(artifacts or ['- None recorded for this job.']) + '\n')
